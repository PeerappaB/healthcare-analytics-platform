<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PubMed KOL Extractor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <div class="container mt-5">
      <div class="card shadow-lg">
        <div class="card-header bg-primary text-white text-center">
          <h2>🧬 PubMed KOL Extractor</h2>
          <p class="mb-0">Search &amp; Extract Author Details</p>
        </div>

        <div class="card-body">
          <h4>🔍 Disease Keyword Search</h4>

          <form action="/extract" method="post">
            <input type="hidden" name="search_type" value="keyword" />

            <div class="mb-3">
              <label for="keyword" class="form-label">Disease Keyword</label>
              <input type="text" class="form-control" id="keyword" name="keyword" required />
            </div>

            <div class="row">
              <div class="col">
                <label for="start_year" class="form-label">Start Year</label>
                <input type="number" class="form-control" id="start_year" name="start_year" value="2024" />
              </div>
              <div class="col">
                <label for="end_year" class="form-label">End Year</label>
                <input type="number" class="form-control" id="end_year" name="end_year" value="2024" />
              </div>
              <div class="col">
                <label for="retmax_keyword" class="form-label">Maximum Articles</label>
                <input type="number" class="form-control" id="retmax_keyword" name="retmax" value="500" />
              </div>
            </div>

            <hr />

            <h5>Output Options</h5>

            <div class="mb-3">
              <label for="keyword_output_type" class="form-label"><strong>Select Output Type</strong></label>
              <select class="form-select output-type" name="output_choice" id="keyword_output_type" data-columns="keyword_columns">
                <option value="1">Full Output</option>
                <option value="2">Custom Columns</option>
              </select>
            </div>

            <div id="keyword_columns" style="display: none;">
              <div class="row">
                <div class="col-md-4"><label><input type="checkbox" name="columns" value="PMID" /> PMID</label></div>
                <div class="col-md-4"><label><input type="checkbox" name="columns" value="Title" /> Title</label></div>
                <div class="col-md-4"><label><input type="checkbox" name="columns" value="Journal" /> Journal</label></div>
                <div class="col-md-4"><label><input type="checkbox" name="columns" value="Year" /> Year</label></div>
                <div class="col-md-4"><label><input type="checkbox" name="columns" value="DOI" /> DOI</label></div>
                <div class="col-md-4"><label><input type="checkbox" name="columns" value="Author Full Name" /> Author Full Name</label></div>
                <div class="col-md-4"><label><input type="checkbox" name="columns" value="Author Position" /> Author Position</label></div>
                <div class="col-md-4"><label><input type="checkbox" name="columns" value="Affiliation" /> Affiliation</label></div>
                <div class="col-md-4"><label><input type="checkbox" name="columns" value="Country" /> Country</label></div>
                <div class="col-md-4"><label><input type="checkbox" name="columns" value="Email ID" /> Email ID</label></div>
                <div class="col-md-4"><label><input type="checkbox" name="columns" value="Trial ID" /> Trial ID</label></div>
                <div class="col-md-4"><label><input type="checkbox" name="columns" value="Grant ID" /> Grant ID</label></div>
                <div class="col-md-4"><label><input type="checkbox" name="columns" value="Publication Type" /> Publication Type</label></div>
                <div class="col-md-4"><label><input type="checkbox" name="columns" value="MeSH Terms" /> MeSH Terms</label></div>
                <div class="col-md-4"><label><input type="checkbox" name="columns" value="Keywords" /> Keywords</label></div>
                <div class="col-md-4"><label><input type="checkbox" name="columns" value="Abstract" /> Abstract</label></div>
                <div class="col-md-4"><label><input type="checkbox" name="columns" value="Department" /> Department</label></div>
                <div class="col-md-4"><label><input type="checkbox" name="columns" value="Institution" /> Institution</label></div>
              </div>
            </div>

            <br />
            <button class="btn btn-success btn-lg w-100" type="submit">Extract Author Details</button>
          </form>

          <hr />

          <h4>🔗 Search by PubMed URL</h4>

          <form action="/extract" method="post">
            <input type="hidden" name="search_type" value="url" />

            <div class="mb-3">
              <label for="pubmed_url" class="form-label">PubMed URL</label>
              <textarea class="form-control" id="pubmed_url" rows="5" name="url" placeholder="Paste PubMed URL here" required></textarea>
            </div>

            <div class="mb-3">
              <label for="retmax_url" class="form-label">Maximum Articles</label>
              <input type="number" class="form-control" id="retmax_url" name="retmax" value="500" />
            </div>

            <hr />

            <h5>Output Options</h5>

            <div class="mb-3">
              <label for="url_output_type" class="form-label"><strong>Select Output Type</strong></label>
              <select class="form-select output-type" name="output_choice" id="url_output_type" data-columns="url_columns">
                <option value="1">Full Output</option>
                <option value="2">Custom Columns</option>
              </select>
            </div>

            <div id="url_columns" style="display: none;">
              <div class="row">
                <div class="col-md-4"><label><input type="checkbox" name="columns" value="PMID" /> PMID</label></div>
                <div class="col-md-4"><label><input type="checkbox" name="columns" value="Title" /> Title</label></div>
                <div class="col-md-4"><label><input type="checkbox" name="columns" value="Journal" /> Journal</label></div>
                <div class="col-md-4"><label><input type="checkbox" name="columns" value="Year" /> Year</label></div>
                <div class="col-md-4"><label><input type="checkbox" name="columns" value="DOI" /> DOI</label></div>
                <div class="col-md-4"><label><input type="checkbox" name="columns" value="Author Full Name" /> Author Full Name</label></div>
                <div class="col-md-4"><label><input type="checkbox" name="columns" value="Author Position" /> Author Position</label></div>
                <div class="col-md-4"><label><input type="checkbox" name="columns" value="Affiliation" /> Affiliation</label></div>
                <div class="col-md-4"><label><input type="checkbox" name="columns" value="Country" /> Country</label></div>
                <div class="col-md-4"><label><input type="checkbox" name="columns" value="Email ID" /> Email ID</label></div>
                <div class="col-md-4"><label><input type="checkbox" name="columns" value="Trial ID" /> Trial ID</label></div>
                <div class="col-md-4"><label><input type="checkbox" name="columns" value="Grant ID" /> Grant ID</label></div>
                <div class="col-md-4"><label><input type="checkbox" name="columns" value="Publication Type" /> Publication Type</label></div>
                <div class="col-md-4"><label><input type="checkbox" name="columns" value="MeSH Terms" /> MeSH Terms</label></div>
                <div class="col-md-4"><label><input type="checkbox" name="columns" value="Keywords" /> Keywords</label></div>
                <div class="col-md-4"><label><input type="checkbox" name="columns" value="Abstract" /> Abstract</label></div>
                <div class="col-md-4"><label><input type="checkbox" name="columns" value="Department" /> Department</label></div>
                <div class="col-md-4"><label><input type="checkbox" name="columns" value="Institution" /> Institution</label></div>
              </div>
            </div>

            <br />
            <button class="btn btn-primary btn-lg w-100" type="submit">Extract Author Details</button>
          </form>
        </div>

        <div class="card-footer text-center">
          Developed by <strong>Peerappa Belamge</strong>
        </div>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // Show the column checkboxes only when "Custom Columns" is selected
        // (works for both the keyword form and the URL form)
        document.querySelectorAll("select.output-type").forEach(function (select) {
          const columnsSection = document.getElementById(select.dataset.columns);
          if (!columnsSection) return;

          const toggle = function () {
            columnsSection.style.display = select.value === "2" ? "block" : "none";
          };

          select.addEventListener("change", toggle);
          toggle();
        });
      });
    </script>
  </body>
</html>
